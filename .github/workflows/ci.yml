name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      planted:
        description: "Plant a failure in the pytest job (PRIDEM_PLANTED=1); that run must be red"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    # Explicit bash gives `-eo pipefail`; the implicit default is only `-e`.
    shell: bash

jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .

  mypy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: mypy .

  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: pytest
        env:
          # Empty on push and on dispatch without `planted`; "1" only on a planted dispatch.
          PRIDEM_PLANTED: ${{ inputs.planted && '1' || '' }}
        run: pytest

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --version
      - name: shellcheck tracked *.sh files
        run: |
          count=$(git ls-files '*.sh' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "shellcheck: 0 tracked *.sh files, nothing to check"
          else
            echo "shellcheck: checking $count tracked *.sh file(s)"
            git ls-files -z '*.sh' | xargs -0 shellcheck
          fi

  wheels-equal-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --dry-run --no-index --find-links wheels/ -r requirements.lock
