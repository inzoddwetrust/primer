name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      planted:
        description: "Plant a failure in the pytest job (PRIDEM_PLANTED=1); that run must be red"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    # Explicit bash gives `-eo pipefail`; the implicit default is only `-e`.
    shell: bash

jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # Runtime exactly as boxes get it: from wheels/ by the lock, with hashes.
      - run: python -m pip install --no-index --find-links wheels/ --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      # Dev tools from the index, constrained to the installed runtime: a tool
      # that needs another runtime version fails here instead of moving it.
      - run: |
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/runtime.txt"
          python -m pip install -c "$RUNNER_TEMP/runtime.txt" -e ".[dev]"
      - run: ruff check . && ruff format --check .

  mypy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # Runtime exactly as boxes get it: from wheels/ by the lock, with hashes.
      - run: python -m pip install --no-index --find-links wheels/ --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      # Dev tools from the index, constrained to the installed runtime: a tool
      # that needs another runtime version fails here instead of moving it.
      - run: |
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/runtime.txt"
          python -m pip install -c "$RUNNER_TEMP/runtime.txt" -e ".[dev]"
      - run: mypy .

  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # Runtime exactly as boxes get it: from wheels/ by the lock, with hashes.
      - run: python -m pip install --no-index --find-links wheels/ --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      # Dev tools from the index, constrained to the installed runtime: a tool
      # that needs another runtime version fails here instead of moving it.
      - run: |
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/runtime.txt"
          python -m pip install -c "$RUNNER_TEMP/runtime.txt" -e ".[dev]"
      # age and sops for the tier 1 tests that decrypt a passport (DM-13): age
      # from apt, sops at the pin of install.sh, checked by its sha256.
      - name: age and sops at the pin of install.sh
        run: |
          sops_version=$(sed -n 's/^SOPS_VERSION="\(.*\)"$/\1/p' install.sh)
          sops_sha256=$(sed -n 's/^SOPS_SHA256="\(.*\)"$/\1/p' install.sh)
          if [ -z "$sops_version" ] || [ -z "$sops_sha256" ]; then
            echo "install.sh pins no sops"
            exit 1
          fi
          sudo apt-get -o DPkg::Lock::Timeout=600 update
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y age
          curl -fsSL -o "$RUNNER_TEMP/sops" "https://github.com/getsops/sops/releases/download/$sops_version/sops-$sops_version.linux.amd64"
          echo "$sops_sha256  $RUNNER_TEMP/sops" | sha256sum -c --strict
          sudo install -m 0755 "$RUNNER_TEMP/sops" /usr/local/bin/sops
          command -v age-keygen sops
      - name: pytest
        env:
          # Empty on push and on dispatch without `planted`; "1" only on a planted dispatch.
          PRIDEM_PLANTED: ${{ inputs.planted && '1' || '' }}
        run: pytest

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: shellcheck --version
      - name: shellcheck tracked *.sh files
        run: |
          count=$(git ls-files '*.sh' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "shellcheck: 0 tracked *.sh files, nothing to check"
          else
            echo "shellcheck: checking $count tracked *.sh file(s)"
            git ls-files -z '*.sh' | xargs -0 shellcheck
          fi
