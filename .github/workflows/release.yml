name: release

# A release of the machine is a tag v{__version__} on the first parent of main
# (TZ section 10.2). Two ways in, one logic (DM-119): the button -- Actions,
# release, Run workflow on main -- releases the head of main as v{__version__}
# in this run alone (a tag the job token makes starts no other workflow), and
# a pushed tag vX.Y.Z releases its commit. The first step of the release job
# names the tag and the commit -- TAG and SHA, every later step reads them --
# and refuses, before anything is made: a tag not of the form vX.Y.Z; on the
# button, a run off main, a tag that exists, a version not after the last.
# Tier 1 runs on the commit first, with every check of ci.yml. The pinned
# build backend is installed before any step holds the job token; on that
# commit the run of ci.yml (a push to main) must have finished green, and a run
# of tier3.yml where every group ran green -- a push of some groups is never a
# release's (DM-125; by a push or by Run workflow) -- no waiting. Only then the wheel is built and install.sh
# gets its pins; the release is published last, and it makes the tag on the
# button's way: a build that fails leaves no tag and no release. No checkout
# keeps the job token in .git/config (DM-82).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tier1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # Runtime exactly as boxes get it: from wheels/ by the lock, with hashes.
      - run: python -m pip install --no-index --find-links wheels/ --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      # Dev tools by their lock, with hashes (DM-82): the lock is compiled with
      # requirements.lock as its constraints, so it pins the runtime as above.
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: ruff check . && ruff format --check .
      - run: mypy .
      # age and sops for the tier 1 tests that decrypt a passport (DM-13): age
      # from apt, sops at the pin of install.sh, checked by its sha256.
      - name: age and sops at the pin of install.sh
        run: |
          sops_version=$(sed -n 's/^SOPS_VERSION="\(.*\)"$/\1/p' install.sh)
          sops_sha256=$(sed -n 's/^SOPS_SHA256="\(.*\)"$/\1/p' install.sh)
          if [ -z "$sops_version" ] || [ -z "$sops_sha256" ]; then
            echo "install.sh pins no sops"
            exit 1
          fi
          sudo apt-get -o DPkg::Lock::Timeout=600 update
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y age
          curl -fsSL -o "$RUNNER_TEMP/sops" "https://github.com/getsops/sops/releases/download/$sops_version/sops-$sops_version.linux.amd64"
          echo "$sops_sha256  $RUNNER_TEMP/sops" | sha256sum -c --strict
          sudo install -m 0755 "$RUNNER_TEMP/sops" /usr/local/bin/sops
          command -v age-keygen sops
      # The probes of DM-182 read what compose would execute with compose
      # itself: the one of the boxes, docker-compose-v2 of noble-updates, not
      # the runner's own copy -- another version reads a file otherwise.
      - name: docker compose of the boxes (DM-182)
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y --no-install-recommends docker-compose-v2
          for dir in "$HOME/.docker/cli-plugins" /usr/local/lib/docker/cli-plugins \
            /usr/local/libexec/docker/cli-plugins /usr/lib/docker/cli-plugins; do
            sudo rm -f "$dir/docker-compose"
          done
          want=$(dpkg-query -W -f '${Version}' docker-compose-v2)
          have=$(docker compose version --short)
          echo "docker-compose-v2 $want, docker compose $have"
          if [ "$want" != "$have" ]; then
            echo "docker compose is not the one of docker-compose-v2"
            exit 1
          fi
      - run: pytest
      # Every check that turns a box red catches its planted defects (par0 9).
      - name: conformance --selftest
        run: python -m pridem.conformance.stack --selftest
      - name: the groups of tier 3 (DM-73) -- --selftest, then the table
        run: |
          python tier3/groups.py --selftest
          python tier3/groups.py
      - run: shellcheck install.sh

  release:
    needs: tier1
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      # checked out with every tag: the button reads the version and the tags
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The tag and the commit of this release, for every later step (DM-119):
      # a pushed tag and its commit, or the button's v{__version__} and the
      # head of main. The tag is a name anyone who can push a tag chooses: its
      # form is checked here, before any step uses it -- in a sed expression,
      # a path, an asset name.
      - name: the tag and the commit of this release
        run: |
          case "$GITHUB_EVENT_NAME" in
            push)
              tag="$GITHUB_REF_NAME"
              ;;
            workflow_dispatch)
              if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "the release is run on main, not $GITHUB_REF"
                exit 1
              fi
              version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' pridem/__init__.py)
              tag="v$version"
              ;;
            *)
              echo "a release by $GITHUB_EVENT_NAME is none"
              exit 1
              ;;
          esac
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag '$tag' is not vX.Y.Z"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "$tag exists: this version is released -- raise __version__"
              exit 1
            fi
            git tag --list "v*" > "$RUNNER_TEMP/tags"
            last=$({ grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' "$RUNNER_TEMP/tags" || true; } | sort -V | tail -n 1)
            if [ -n "$last" ] && [ "$(printf '%s\n%s\n' "$last" "$tag" | sort -V | tail -n 1)" != "$tag" ]; then
              echo "$tag is not after $last"
              exit 1
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "release $tag at $GITHUB_SHA ($GITHUB_EVENT_NAME)"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: tag is v{__version__} on the first parent of main
        run: |
          version=$(python -c 'import re, pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("pridem/__init__.py").read_text()).group(1))')
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG is not v$version (pridem/__init__.py)"
            exit 1
          fi
          # into a file, not a pipe: grep -q stops at the first match, and
          # rev-list writing a long history into the closed pipe dies of
          # SIGPIPE, which pipefail turns into a refusal
          git rev-list --first-parent origin/main > "$RUNNER_TEMP/first-parent"
          if ! grep -qx "$SHA" "$RUNNER_TEMP/first-parent"; then
            echo "$SHA is not on the first parent of main"
            exit 1
          fi
      - run: python -m pip install --require-hashes -r requirements-build.lock
      - name: ci and tier 3 are green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=100" > "$RUNNER_TEMP/runs-ci.yml.json"
          python3 - "$RUNNER_TEMP/runs-ci.yml.json" <<'EOF'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              runs = json.load(handle)["workflow_runs"]
          if not runs:
              sys.exit("ci.yml has not run on this commit: no release")
          last = max(runs, key=lambda run: run["run_number"])
          state = last["conclusion"] if last["status"] == "completed" else last["status"]
          if state != "success":
              sys.exit(f"ci.yml on this commit is {state}: {last['html_url']}")
          print(f"ci.yml on this commit is green: {last['html_url']}")
          EOF
          # tier 3: a run where every group ran green -- a push of some groups
          # is never a release's (DM-125); by a push or by hand
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tier3.yml/runs?head_sha=$SHA&per_page=100" > "$RUNNER_TEMP/runs-tier3.json"
          mkdir -p "$RUNNER_TEMP/tier3-jobs"
          # the jobs of every run: which ran every group, red or green
          for id in $(python3 -c 'import json, sys; print(" ".join(str(r["id"]) for r in json.load(open(sys.argv[1]))["workflow_runs"]))' "$RUNNER_TEMP/runs-tier3.json"); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" > "$RUNNER_TEMP/tier3-jobs/$id.json"
          done
          python3 tier3/groups.py --full-run "$RUNNER_TEMP/runs-tier3.json" "$RUNNER_TEMP/tier3-jobs"
      - run: python -m pip wheel --no-deps --no-build-isolation --no-index -w dist .
      - name: install.sh with its pins
        run: |
          wheel="dist/pridem-${TAG#v}-py3-none-any.whl"
          sha=$(sha256sum "$wheel" | cut -d " " -f 1)
          sed -e "s/@PRIDEM_TAG@/$TAG/" \
            -e "s/@PRIDEM_COMMIT@/$SHA/" \
            -e "s/@PRIDEM_WHEEL_SHA256@/$sha/" \
            -e "s|@PRIDEM_REPO@|https://github.com/$GITHUB_REPOSITORY|" \
            -e "s|@PRIDEM_WHEEL_URL@|https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/pridem-${TAG#v}-py3-none-any.whl|" \
            install.sh > dist/install.sh
          if grep -n "@PRIDEM_" dist/install.sh; then
            echo "a pin was not substituted"
            exit 1
          fi
      - run: shellcheck dist/install.sh
      # Last: the release, and with it the tag on the button's way (--target);
      # a pushed tag is there already, and --target leaves it as it is.
      - name: GitHub Release with the wheel and install.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --target "$SHA" \
            "dist/pridem-${TAG#v}-py3-none-any.whl" dist/install.sh \
            --title "pridem $TAG" --notes "pridem $TAG at $SHA"
