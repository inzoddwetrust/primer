name: tier3

# Tier 3 (TZ section 17): the runner is a clean, single-use box. What it brings
# that a box does not have -- docker, Python outside the system one -- goes
# first, so the bootstrap is real. The wheel is built in the run from the pinned
# backend; install.sh gets its pins from this run -- the pushed commit under a
# temporary tag v{__version__} in a local bare clone, the wheel by file:// --
# and installs the machine the way it installs a box. Then the tier 3 probes run
# as root against the installed binary. No step depends on the directory it
# starts in: the job runs in the clone ($GITHUB_WORKSPACE, checked out first)
# and every file of the repository is named from $GITHUB_WORKSPACE.

# The probes' venv gets its packages by the locks, with hashes, before any step
# that holds a secret or the job token; no checkout keeps the token in
# .git/config (DM-82).

# A pull request runs tier 3 too, without secrets: the step that writes the
# deploy key is skipped and the one probe that needs it (DM-10, group a) is
# deselected by name, printed in the log of every group (in the others the
# name selects nothing).

# Tier 3 is a matrix of groups (DM-73; tier3/groups.py): each group a job on a
# clean runner of its own, with the whole preparation of the box; a group
# that needs the blank installed gets it from a fixture. A red group does not
# stop the others (fail-fast: false): one red hides no state of another. Tier
# 3 is green when every group is.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  box:
    name: box (${{ matrix.group }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: [a, b, c, d, e]
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: remove what the runner brings (docker, Python outside the system)
        run: |
          mapfile -t packages < <(dpkg-query -W -f='${Package} ${db:Status-Status}\n' \
            | awk '$2 == "installed" && $1 ~ /^(docker|moby|containerd|runc)/ {print $1}')
          if [ "${#packages[@]}" -gt 0 ]; then
            sudo apt-get -o DPkg::Lock::Timeout=600 purge -y "${packages[@]}"
          fi
          sudo rm -rf /opt/hostedtoolcache/Python /opt/pipx /opt/pipx_bin /usr/local/lib/python3*/dist-packages/*
          if command -v docker; then
            echo "docker is still on the runner"
            exit 1
          fi
          echo "python3 is $(command -v python3): $(python3 --version)"
      - name: build the wheel from the pinned backend
        run: |
          # venv for the build; install.sh asks for python3-venv again, as on a box
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y python3-venv
          python3 -m venv /tmp/build
          /tmp/build/bin/python -m pip install --require-hashes -r "$GITHUB_WORKSPACE/requirements-build.lock"
          /tmp/build/bin/python -m pip wheel --no-deps --no-build-isolation --no-index -w /tmp/tier3/dist "$GITHUB_WORKSPACE"
      - name: install.sh with this run's sources
        run: |
          version=$(python3 -c 'import re, pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("'"$GITHUB_WORKSPACE"'/pridem/__init__.py").read_text()).group(1))')
          tag="v$version"
          git clone --quiet --bare "$GITHUB_WORKSPACE" /tmp/tier3/primer.git
          git -C /tmp/tier3/primer.git tag -f "$tag" "$GITHUB_SHA"
          wheel="/tmp/tier3/dist/pridem-$version-py3-none-any.whl"
          sha=$(sha256sum "$wheel" | cut -d " " -f 1)
          sed -e "s/@PRIDEM_TAG@/$tag/" \
            -e "s/@PRIDEM_COMMIT@/$GITHUB_SHA/" \
            -e "s/@PRIDEM_WHEEL_SHA256@/$sha/" \
            -e "s|@PRIDEM_REPO@|file:///tmp/tier3/primer|" \
            -e "s|@PRIDEM_WHEEL_URL@|file://$wheel|" \
            "$GITHUB_WORKSPACE/install.sh" > /tmp/tier3/install.sh
          if grep -n "@PRIDEM_" /tmp/tier3/install.sh; then
            echo "a pin was not substituted"
            exit 1
          fi
          sudo bash /tmp/tier3/install.sh
      - name: the probes' venv, by the locks with hashes
        run: |
          python3 -m venv /tmp/t3
          /tmp/t3/bin/python -m pip install --no-index --find-links "$GITHUB_WORKSPACE/wheels" --require-hashes -r "$GITHUB_WORKSPACE/requirements.lock"
          /tmp/t3/bin/python -m pip install --no-deps -e "$GITHUB_WORKSPACE"
          /tmp/t3/bin/python -m pip install --require-hashes -r "$GITHUB_WORKSPACE/requirements-dev.lock"
      - name: the deploy key of primer-blank, from the CI secrets (DM-10)
        if: github.event_name != 'pull_request'
        env:
          PRIMER_BLANK_DEPLOY_KEY: ${{ secrets.PRIMER_BLANK_DEPLOY_KEY }}
        run: |
          # GitHub gives a secret that is not set as an empty string: either
          # way there is no key, and the probe of DM-10 would fail later in ssh
          if [ -z "$PRIMER_BLANK_DEPLOY_KEY" ]; then
            echo "secret PRIMER_BLANK_DEPLOY_KEY is empty or not set: no deploy key for DM-10"
            exit 1
          fi
          (umask 077 && printf '%s\n' "$PRIMER_BLANK_DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key")
      - name: the GitHub API header, from the workflow's own token (DM-52)
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          (umask 077 && printf 'Authorization: Bearer %s\n' "$GITHUB_API_TOKEN" > "$RUNNER_TEMP/github_api_header")
      - name: tier 3 probes
        env:
          TIER3_GROUP: ${{ matrix.group }}
          PRIMER_DEPLOY_KEY_FILE: ${{ runner.temp }}/deploy_key
          PRIMER_GITHUB_API_HEADER_FILE: ${{ runner.temp }}/github_api_header
        run: |
          deselect=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "pull_request: no secrets, so no deploy key -- DM-10 is not run"
            deselect=(-k "not test_probe_DM_10_blank_is_fetched_by_ref_over_ssh")
          fi
          sudo --preserve-env=PRIMER_DEPLOY_KEY_FILE,PRIMER_GITHUB_API_HEADER_FILE /tmp/t3/bin/python -m pytest -q -p no:cacheprovider --durations=0 --rootdir "$GITHUB_WORKSPACE" --tier3-group "$TIER3_GROUP" "${deselect[@]}" "$GITHUB_WORKSPACE/tier3"
