name: tier3

# Tier 3 (TZ section 17): the runner is a clean, single-use box. What it brings
# that a box does not have -- docker, Python outside the system one -- goes
# first, so the bootstrap is real. The wheel is built in the run from the pinned
# backend; install.sh gets its pins from this run -- the pushed commit under a
# temporary tag v{__version__} in a local bare clone, the wheel by file:// --
# and installs the machine the way it installs a box. Then the tier 3 probes run
# as root against the installed binary. No step depends on the directory it
# starts in: the job runs in the clone ($GITHUB_WORKSPACE, checked out first)
# and every file of the repository is named from $GITHUB_WORKSPACE.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  box:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: remove what the runner brings (docker, Python outside the system)
        run: |
          mapfile -t packages < <(dpkg-query -W -f='${Package} ${db:Status-Status}\n' \
            | awk '$2 == "installed" && $1 ~ /^(docker|moby|containerd|runc)/ {print $1}')
          if [ "${#packages[@]}" -gt 0 ]; then
            sudo apt-get -o DPkg::Lock::Timeout=600 purge -y "${packages[@]}"
          fi
          sudo rm -rf /opt/hostedtoolcache/Python /opt/pipx /opt/pipx_bin /usr/local/lib/python3*/dist-packages/*
          if command -v docker; then
            echo "docker is still on the runner"
            exit 1
          fi
          echo "python3 is $(command -v python3): $(python3 --version)"
      - name: build the wheel from the pinned backend
        run: |
          # venv for the build; install.sh asks for python3-venv again, as on a box
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y python3-venv
          python3 -m venv /tmp/build
          /tmp/build/bin/python -m pip install --require-hashes -r "$GITHUB_WORKSPACE/requirements-build.lock"
          /tmp/build/bin/python -m pip wheel --no-deps --no-build-isolation --no-index -w /tmp/tier3/dist "$GITHUB_WORKSPACE"
      - name: install.sh with this run's sources
        run: |
          version=$(python3 -c 'import re, pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("'"$GITHUB_WORKSPACE"'/pridem/__init__.py").read_text()).group(1))')
          tag="v$version"
          git clone --quiet --bare "$GITHUB_WORKSPACE" /tmp/tier3/primer.git
          git -C /tmp/tier3/primer.git tag -f "$tag" "$GITHUB_SHA"
          wheel="/tmp/tier3/dist/pridem-$version-py3-none-any.whl"
          sha=$(sha256sum "$wheel" | cut -d " " -f 1)
          sed -e "s/@PRIDEM_TAG@/$tag/" \
            -e "s/@PRIDEM_COMMIT@/$GITHUB_SHA/" \
            -e "s/@PRIDEM_WHEEL_SHA256@/$sha/" \
            -e "s|@PRIDEM_REPO@|file:///tmp/tier3/primer|" \
            -e "s|@PRIDEM_WHEEL_URL@|file://$wheel|" \
            "$GITHUB_WORKSPACE/install.sh" > /tmp/tier3/install.sh
          if grep -n "@PRIDEM_" /tmp/tier3/install.sh; then
            echo "a pin was not substituted"
            exit 1
          fi
          sudo bash /tmp/tier3/install.sh
      - name: tier 3 probes
        run: |
          python3 -m venv /tmp/t3
          /tmp/t3/bin/python -m pip install --no-index --find-links "$GITHUB_WORKSPACE/wheels" --require-hashes -r "$GITHUB_WORKSPACE/requirements.lock"
          /tmp/t3/bin/python -m pip install --no-deps -e "$GITHUB_WORKSPACE"
          /tmp/t3/bin/python -m pip freeze --exclude-editable > "$RUNNER_TEMP/runtime.txt"
          /tmp/t3/bin/python -m pip install -c "$RUNNER_TEMP/runtime.txt" -e "$GITHUB_WORKSPACE[dev]"
          sudo /tmp/t3/bin/python -m pytest -q -p no:cacheprovider --rootdir "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tier3"
