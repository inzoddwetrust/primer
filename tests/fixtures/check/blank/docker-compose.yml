# The stack `blank` of primer.yaml. The machine names the compose project
# (-p) and passes the stack's env with --env-file; every variable below is
# required, ${VAR:?} (contract 3 rule 18).

services:
  app:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://blank:${POSTGRES_PASSWORD:?}@postgres:5432/blank
      EDITION: ${EDITION:?}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
    environment:
      API_BASE_URL: ${API_BASE_URL:?}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/config.json"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_USER: blank
      POSTGRES_DB: blank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "blank", "-d", "blank"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata: {}
