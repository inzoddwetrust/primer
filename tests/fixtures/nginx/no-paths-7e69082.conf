# rendered by pridem from host.routes of primer.yaml; an edit here is drift
server {
  listen 80 default_server;
  server_name _;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl default_server;
  server_name _;
  ssl_certificate /etc/pridem/certs/fullchain.pem;
  ssl_certificate_key /etc/pridem/certs/privkey.pem;
  return 444;
}
server {
  listen 443 ssl;
  server_name blank.example.org;
  ssl_certificate /etc/pridem/certs/fullchain.pem;
  ssl_certificate_key /etc/pridem/certs/privkey.pem;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  resolver 127.0.0.11 valid=10s ipv6=off;
  location / {
    set $upstream http://blank-frontend:80;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'" always;
  }
}
server {
  listen 443 ssl;
  server_name api.blank.example.org;
  ssl_certificate /etc/pridem/certs/fullchain.pem;
  ssl_certificate_key /etc/pridem/certs/privkey.pem;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 100M;
  location = /h { return 404; }
  location = /r { return 404; }
  location / {
    set $upstream http://blank-app:8000;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_read_timeout 300s;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'" always;
  }
}
