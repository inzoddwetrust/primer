[build-system]
requires = ["flit_core>=4.1,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "pridem"
description = "pridem -- the Primer deploy machine"
readme = "README.md"
requires-python = "==3.12.*"
dynamic = ["version"]
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "click>=8,<9",
    "packaging>=26,<27",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "types-PyYAML==6.0.12.20260906",
]

[project.scripts]
pridem = "pridem.cli:main"

[tool.mypy]
strict = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"pridem/runner.py" = ["S603"]
"tests/**" = ["S101"]
"tier3/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
